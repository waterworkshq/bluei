plugin_id: php
enabled: true
fix_engine: deterministic
framework: composer
rule_pack: null
discovery:
  ecosystem: php
  max_findings: 40
baseline_checks:
  - ["php", "artisan", "test"]
  - ["./vendor/bin", "phpunit"]
limits:
  max_files_changed: 3
  max_loc_diff: 120
  max_fix_attempts: 2
  open_issues_cap: 8
  open_prs_cap: 2
safety:
  mode: observe
  profile: conservative
meta:
  template_version: 2
  ecosystem: php
  template_type: composer-app
