plugin_id: java
enabled: true
fix_engine: deterministic
framework: maven
rule_pack: null
discovery:
  ecosystem: java
  max_findings: 40
baseline_checks:
  - ["mvn", "test", "-q"]
  - ["mvn", "checkstyle:check", "-q"]
limits:
  max_files_changed: 3
  max_loc_diff: 120
  max_fix_attempts: 2
  open_issues_cap: 8
  open_prs_cap: 2
safety:
  mode: observe
  profile: conservative
meta:
  template_version: 2
  ecosystem: java
  template_type: maven-service
