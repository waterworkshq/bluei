plugin_id: typescript
enabled: true
fix_engine: deterministic
framework: express
rule_pack: node-backend-safe
discovery:
  ecosystem: node
  max_findings: 50
  use_docker: true
  docker_hint: review container/service name before first live run
limits:
  max_files_changed: 3
  max_loc_diff: 100
  max_fix_attempts: 2
  open_issues_cap: 10
  open_prs_cap: 2
safety:
  mode: observe
  profile: conservative
meta:
  template_version: 2
  ecosystem: node
  template_type: api
