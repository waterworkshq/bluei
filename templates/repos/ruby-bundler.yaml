plugin_id: ruby
enabled: true
fix_engine: deterministic
framework: bundler
rule_pack: null
discovery:
  ecosystem: ruby
  max_findings: 40
baseline_checks:
  - ["bundle", "exec", "rspec"]
  - ["bundle", "exec", "rubocop"]
limits:
  max_files_changed: 3
  max_loc_diff: 120
  max_fix_attempts: 2
  open_issues_cap: 8
  open_prs_cap: 2
safety:
  mode: observe
  profile: conservative
meta:
  template_version: 2
  ecosystem: ruby
  template_type: bundler-app
