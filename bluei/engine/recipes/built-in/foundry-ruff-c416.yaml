id: foundry-ruff-c416
rule: ruff-c416
language: python
safety: needs_validation
description: Rewrite unnecessary list comprehension `[x for x in iter]` as `list(iter)`
match:
  type: rule_exact
  rule: ruff-c416
replacement:
  type: regex_substitute
  pattern: \[(\w+) for \1 in (\w+)\]
  replacement: list(\2)
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-c416
  source_bundle_id: gb-ruff-c416
priority: 50
