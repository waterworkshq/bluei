id: foundry-ruff-b904
rule: ruff-b904
language: python
safety: needs_validation
description: Add `as err` to except clause and `from err` to re-raised exception
match:
  type: rule_exact
  rule: ruff-b904
  scope: file
replacement:
  type: regex_substitute
  pattern: except (\w+):\n(\s+)raise (.+)
  replacement: except \1 as err:\n\2raise \3 from err
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-b904
  source_bundle_id: gb-ruff-b904-raise-with-from
priority: 100
