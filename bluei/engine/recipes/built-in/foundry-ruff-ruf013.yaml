id: foundry-ruff-ruf013
rule: ruff-ruf013
language: python
safety: needs_validation
description: Wrap type annotation in Optional[] when parameter default is None
match:
  type: rule_exact
  rule: ruff-ruf013
replacement:
  type: regex_substitute
  pattern: '\b(\w+): (\w+) = None\b'
  replacement: '$1: Optional[$2] = None'
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-ruf013
  source_bundle_id: gb-ruff-ruf013
priority: 50
