id: foundry-eslint-prefer-const
rule: eslint-prefer-const
language: javascript
safety: safe
description: Replace `let` with `const` for variables never reassigned
match:
  type: rule_exact
  rule: eslint-prefer-const
replacement:
  type: text
  value: const
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-eslint-prefer-const
  source_bundle_id: gb-eslint-prefer-const
priority: 50
