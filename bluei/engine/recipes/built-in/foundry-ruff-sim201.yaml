id: foundry-ruff-sim201
rule: ruff-sim201
language: python
safety: safe
description: Simplify `not x == y` to `x != y` in conditional expressions
match:
  type: rule_exact
  rule: ruff-sim201
  scope: line
replacement:
  type: regex_substitute
  pattern: 'if not (\w+) == (\w+):'
  replacement: 'if \1 != \2:'
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-sim201
  source_bundle_id: gb-ruff-sim201
priority: 50
