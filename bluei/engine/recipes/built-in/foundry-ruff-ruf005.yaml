id: foundry-ruff-ruf005
rule: ruff-ruf005
language: python
safety: needs_validation
description: Rewrite `[a] + [b]` list concatenation to `[a, *(b)]` unpacking syntax
match:
  type: rule_exact
  rule: ruff-ruf005
replacement:
  type: regex_substitute
  pattern: \[([^\]]+)\] \+ \[([^\]]+)\]
  replacement: '[$1, *([$2])]'
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-ruf005
  source_bundle_id: gb-ruff-ruf005
priority: 50
