id: foundry-ruff-c400
rule: ruff-c400
language: python
safety: needs_validation
description: Convert unnecessary generator-in-list() call to a list comprehension
match:
  type: rule_exact
  rule: ruff-c400
replacement:
  type: regex_substitute
  pattern: list\((.+? for .+?)\)
  replacement: '[\1]'
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-c400
  source_bundle_id: gb-ruff-c400
priority: 100
