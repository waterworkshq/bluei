id: foundry-ruff-s105
rule: ruff-s105
language: python
safety: needs_validation
description: Replace hardcoded password literal with credential function call
match:
  type: rule_exact
  rule: ruff-s105
  scope: line
replacement:
  type: regex_substitute
  pattern: password\s*=\s*"[^"]*"
  replacement: password = get_credential()
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-s105
  source_bundle_id: gb-ruff-s105
priority: 50
