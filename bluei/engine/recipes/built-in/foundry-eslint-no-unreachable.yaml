id: foundry-eslint-no-unreachable
rule: eslint-no-unreachable
language: javascript
safety: needs_validation
description: Swap the unreachable statement with the preceding return so reachable
  code runs first
match:
  type: rule_exact
  rule: eslint-no-unreachable
replacement:
  type: regex_substitute
  pattern: return\s+(\w+);\n(\s+)emit\(\1\);
  replacement: emit($1);\n$2return $1;
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-eslint-no-unreachable
  source_bundle_id: gb-eslint-no-unreachable
priority: 50
