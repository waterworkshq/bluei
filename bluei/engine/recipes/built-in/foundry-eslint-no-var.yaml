id: foundry-eslint-no-var
rule: eslint-no-var
language: javascript
safety: safe
description: Replace var declarations with const
match:
  type: rule_exact
  rule: eslint-no-var
replacement:
  type: text
  value: const
  count: 2
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-eslint-no-var
  source_bundle_id: gb-eslint-no-var
priority: 50
