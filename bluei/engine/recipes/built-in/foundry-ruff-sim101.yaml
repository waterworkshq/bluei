id: foundry-ruff-sim101
rule: ruff-sim101
language: python
safety: needs_validation
description: Collapse chained isinstance(x, A) or isinstance(x, B) into isinstance(x,
  (A, B))
match:
  type: rule_exact
  rule: ruff-sim101
replacement:
  type: regex_substitute
  pattern: isinstance\(([^,]+),\s*([^)]+)\)\s+or\s+isinstance\(\1,\s*([^)]+)\)
  replacement: isinstance(\1, (\2, \3))
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-sim101
  source_bundle_id: gb-ruff-sim101
priority: 50
