id: foundry-ruff-b028
rule: ruff-b028
language: python
safety: needs_validation
description: Add stacklevel=2 to warnings.warn calls to silence B028
match:
  type: rule_exact
  rule: ruff-b028
replacement:
  type: regex_substitute
  pattern: warnings\.warn\(([^)]+)\)
  replacement: warnings.warn(\1, stacklevel=2)
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-ruff-b028
  source_bundle_id: gb-ruff-b028
priority: 50
