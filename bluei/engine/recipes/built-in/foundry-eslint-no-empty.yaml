id: foundry-eslint-no-empty
rule: eslint-no-empty
language: javascript
safety: needs_validation
description: Add logger.error statement to empty catch blocks flagged by eslint-no-empty
match:
  type: rule_exact
  rule: eslint-no-empty
  scope: file
replacement:
  type: regex_substitute
  pattern: catch \((\w+)\) \{\s*\}
  replacement: catch ($1) {\n  logger.error("report write failed", $1);\n}
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-eslint-no-empty
  source_bundle_id: gb-eslint-no-empty
priority: 50
