id: foundry-eslint-no-debugger
rule: eslint-no-debugger
language: javascript
safety: safe
description: Remove `debugger;` statements flagged by no-debugger
match:
  type: rule_exact
  rule: eslint-no-debugger
  scope: line
replacement:
  type: regex_substitute
  pattern: ^\s*debugger;\s*\r?\n
  replacement: ''
  count: 1
validation:
  run_baseline: true
  run_target: true
metadata:
  version: 1
  author: bluei-recipe-foundry
  source_pattern_id: seed-eslint-no-debugger
  source_bundle_id: gb-eslint-no-debugger
priority: 50
