- rule: ruff-c408
  default_strategy: deterministic
  contexts:
  - file_patterns:
    - '**/migrations/*.py'
    framework: django
    fix_strategy: skip
    prompt_hint: Django migration files require dict() for runtime model resolution.
      Do not rewrite.
  - file_patterns:
    - '**/test_*.py'
    - '**/*_test.py'
    - tests/**
    framework: any
    fix_strategy: deterministic_safe
    prompt_hint: Using dict() literal in test files is safe.
