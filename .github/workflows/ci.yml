name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Bootstrap
      run: ./scripts/bootstrap.sh

    # The discovery/e2e tests exercise the real onboard→scan pipeline, whose
    # Python preflight requires ruff on PATH (runners have none of the
    # optional linters). Install into the venv and put the venv's bin dir on
    # PATH for the subprocess-spawned CLI.
    - name: Install discovery linters
      run: |
        uv pip install --python .venv/bin/python ruff
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

    - name: Run tests
      run: |
        PYTHONPATH=. .venv/bin/python -m pytest tests/ -q \
          --deselect tests/test_batch_split.py::TestProcessBatchSplitWiring::test_process_batch_calls_split_on_high_failure_rate \
          --deselect tests/test_lifecycle.py::TestRunSmokeTest::test_clean_repo_passes \
          --deselect tests/test_review.py::test_render_backend_command_uses_review_template
